# Weekly pull requests for outdated packages (security fixes arrive as soon as they are published).
# Minor and patch updates are grouped into one PR so they are easy to review; CI runs on each.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      kucuk-guncellemeler:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
