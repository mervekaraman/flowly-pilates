name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the build when a package that reaches production has a known high or critical hole.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
