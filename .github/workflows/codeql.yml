name: CodeQL

# GitHub's code scanning for security bugs (injection, XSS, unsafe redirects…). Free for public
# repositories; findings appear under Security › Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
