<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flowly</title>
  <!-- Shown by the iOS app when the live site cannot be reached (see capacitor.config.ts). -->
  <style>
    :root { --ivory: #f8f5e8; --ink: #1d1b1b; --cta: #28171a; --muted: #77716c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; padding-top: max(24px, env(safe-area-inset-top));
      background: var(--ivory); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 24px 0 8px; font-size: 22px; font-weight: 600; }
    p { margin: 0 0 28px; max-width: 280px; color: var(--muted); font-size: 16px; line-height: 1.45; }
    a {
      display: inline-block; padding: 14px 32px; border-radius: 999px;
      background: var(--cta); color: var(--ivory); font-size: 16px; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <img src="icon.png" alt="">
  <h1>Bağlantı kurulamadı</h1>
  <p>İnternet bağlantını kontrol edip tekrar dene.</p>
  <a id="retry" href="https://smeda-pilates.vercel.app/">Tekrar dene</a>
  <script>
    // Go back to the live site as soon as the phone is online again.
    window.addEventListener("online", function () {
      window.location.href = document.getElementById("retry").href;
    });
  </script>
</body>
</html>
